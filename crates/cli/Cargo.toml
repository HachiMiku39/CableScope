[package]
name = "cablescope-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "CableScope"
path = "src/main.rs"

[dependencies]
cablescope-analysis = { path = "../analysis" }
cablescope-backends-traits = { path = "../backends-traits" }
cablescope-core = { path = "../core" }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
cablescope-backends-windows = { path = "../backends-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
cablescope-backends-macos = { path = "../backends-macos" }
