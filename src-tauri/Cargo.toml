[workspace]

[package]
name = "CableScope"
version = "0.4.0"
description = "CableScope desktop shell"
authors = ["CableScope contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"
default-run = "CableScope"

[lib]
name = "cablescope_tauri"
path = "src/lib.rs"

[[bin]]
name = "CableScope"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

