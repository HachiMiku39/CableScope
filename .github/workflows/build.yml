name: Build CableScope
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
            arch: x64
            exe: CableScope.exe
          - target: windows-arm64
            os: windows-11-arm
            arch: arm64
            exe: CableScope.exe
          - target: macos-arm64
            os: macos-26
            arch: arm64
            exe: CableScope.app/Contents/MacOS/CableScope
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m unittest discover -s tests -v
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: python scripts/smoke.py
      - name: Rust unit tests (macOS parity gate)
        if: matrix.target == 'macos-arm64'
        run: cargo test --workspace --locked
      - name: Python ↔ Rust field-level differential (macOS)
        if: matrix.target == 'macos-arm64'
        run: |
          python3 run.py --json > py.json
          cargo run -q -p cablescope-cli -- --json > rust.json
          python3 scripts/diff_rust_python.py py.json rust.json --verbose
      - run: python -m pip install -r requirements-build.txt
      - name: Build and test embedded native collector
        run: python scripts/build.py --target ${{ matrix.target }} --collector-only
      - name: Build native Tauri executable or app
        run: npm run desktop:build
      - name: Package portable release archive
        run: python scripts/package_tauri.py ${{ matrix.target }}
      - name: Extract portable release archive
        shell: bash
        run: |
          set -e
          ZIP="dist/desktop/CableScope-$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')-${{ matrix.target }}.zip"
          mkdir -p dist/unpacked
          if [ "${{ matrix.target }}" = "macos-arm64" ]; then
            # ditto restores Unix permissions and symlinks that zipfile.extractall drops.
            ditto -x -k "$ZIP" dist/unpacked
          else
            python3 -c 'import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$ZIP" dist/unpacked
          fi
      - name: Test unpacked portable release
        run: node scripts/smoke_tauri.cjs dist/unpacked/${{ matrix.exe }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CableScope-${{ matrix.target }}
          path: dist/desktop/CableScope-*.zip
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish desktop release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: CableScope-*
          path: release-assets
          merge-multiple: true
      - name: Verify and publish three native clients
        run: python scripts/publish_release.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
