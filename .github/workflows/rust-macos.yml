name: rust-macos

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "cablescope/**"
      - "scripts/diff_rust_python.py"
      - "scripts/build.py"
      - ".github/workflows/rust-macos.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test-and-diff:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests (synthetic data only)
        run: cargo test --workspace --locked
      - name: Python single capture (golden reference)
        run: python3 run.py --json > py.json
      - name: Rust single capture
        run: cargo run -q -p cablescope-cli -- --json > rust.json
      - name: Field-level differential
        run: python3 scripts/diff_rust_python.py py.json rust.json --verbose
      - name: Python unittest regression
        run: python3 -m unittest discover -s tests
